# Render Blueprint for the MediCore monorepo.
# The free plans are suitable for a demo; free services may spin down when idle.
services:
  - type: web
    name: medicore-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    dockerCommand: sh -c "npx prisma db push --skip-generate && node src/server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medicore-redis
          type: keyvalue
          envVarKey: REDIS_URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NOTIFICATION_MODE
        value: console
      - key: WEB_ORIGIN
        value: https://medicore-web.onrender.com

  - type: worker
    name: medicore-worker
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    dockerCommand: node src/jobs/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medicore-redis
          type: keyvalue
          envVarKey: REDIS_URL

  - type: web
    name: medicore-web
    runtime: docker
    plan: free
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://medicore-api.onrender.com/api/v1

  - type: web
    name: medicore-analytics
    runtime: python
    plan: free
    rootDir: apps/analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

  - type: keyvalue
    name: medicore-redis
    plan: free
    ipAllowList: []

databases:
  - name: medicore-db
    plan: free
    databaseName: medicore
    user: medicore
    postgresMajorVersion: "16"
