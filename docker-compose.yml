services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: medicore, POSTGRES_USER: medicore, POSTGRES_PASSWORD: medicore_dev_only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U medicore], interval: 5s, timeout: 3s, retries: 10}
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
    networks: [private]
  api:
    build: ./apps/api
    env_file: .env
    environment: {DATABASE_URL: "postgresql://medicore:medicore_dev_only@db:5432/medicore?schema=public", REDIS_URL: redis://redis:6379, FHIR_BASE_URL: http://fhir-mock:8080/fhir}
    command: sh -c "npx prisma db push --skip-generate && node src/server.js"
    ports: ["4000:4000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 10}
    networks: [private]
  web:
    build: ./apps/web
    environment: {NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
    networks: [private]
  worker:
    build: ./apps/api
    env_file: .env
    environment: {DATABASE_URL: "postgresql://medicore:medicore_dev_only@db:5432/medicore?schema=public", REDIS_URL: redis://redis:6379}
    command: ["node", "src/jobs/worker.js"]
    depends_on: {redis: {condition: service_healthy}}
    networks: [private]
  analytics:
    build: ./apps/analytics
    ports: ["8000:8000"]
    networks: [private]
  fhir-mock:
    image: hapiproject/hapi:latest
    profiles: [integrations]
    ports: ["8081:8080"]
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
